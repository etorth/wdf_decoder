<!doctype html>
<meta charset="utf-8">
<title>WDF sprite preview</title>
<style>
body{font:16px system-ui;background:#202124;color:#eee;margin:24px}
#gallery{display:flex;flex-wrap:wrap;gap:16px}
article{background:#303134;padding:12px;width:240px}
canvas{width:240px;height:240px;object-fit:contain;
background:repeating-conic-gradient(#555 0% 25%,#444 0% 50%) 0/16px 16px}
select{margin:8px} a{color:#9cf}
</style>
<h1>WDF sprite preview</h1>
<p>One card per resource. Select a direction; animations run at 10 fps
(preview speed, not timing stored in the source). PNGs retain transparency.</p>
<div id="gallery"></div>
<script id="manifest" type="application/json">{"entries": [{"directions": 1, "frames_per_direction": 15, "width": 130, "height": 151, "x": 56, "y": 111, "frames": [{"index": 0, "direction": 0, "frame": 0, "empty": false, "x": 16, "y": -3, "width": 31, "height": 17, "file": "d00_f000.png"}, {"index": 1, "direction": 0, "frame": 1, "empty": false, "x": 23, "y": 25, "width": 57, "height": 57, "file": "d00_f001.png"}, {"index": 2, "direction": 0, "frame": 2, "empty": false, "x": 29, "y": 51, "width": 79, "height": 85, "file": "d00_f002.png"}, {"index": 3, "direction": 0, "frame": 3, "empty": false, "x": 37, "y": 73, "width": 100, "height": 109, "file": "d00_f003.png"}, {"index": 4, "direction": 0, "frame": 4, "empty": false, "x": 41, "y": 77, "width": 103, "height": 117, "file": "d00_f004.png"}, {"index": 5, "direction": 0, "frame": 5, "empty": false, "x": 47, "y": 95, "width": 106, "height": 135, "file": "d00_f005.png"}, {"index": 6, "direction": 0, "frame": 6, "empty": false, "x": 49, "y": 89, "width": 114, "height": 129, "file": "d00_f006.png"}, {"index": 7, "direction": 0, "frame": 7, "empty": false, "x": 52, "y": 95, "width": 119, "height": 135, "file": "d00_f007.png"}, {"index": 8, "direction": 0, "frame": 8, "empty": false, "x": 54, "y": 103, "width": 128, "height": 141, "file": "d00_f008.png"}, {"index": 9, "direction": 0, "frame": 9, "empty": false, "x": 56, "y": 105, "width": 122, "height": 143, "file": "d00_f009.png"}, {"index": 10, "direction": 0, "frame": 10, "empty": false, "x": 50, "y": 105, "width": 115, "height": 141, "file": "d00_f010.png"}, {"index": 11, "direction": 0, "frame": 11, "empty": false, "x": 51, "y": 109, "width": 112, "height": 145, "file": "d00_f011.png"}, {"index": 12, "direction": 0, "frame": 12, "empty": false, "x": 52, "y": 111, "width": 116, "height": 149, "file": "d00_f012.png"}, {"index": 13, "direction": 0, "frame": 13, "empty": false, "x": 50, "y": 99, "width": 109, "height": 137, "file": "d00_f013.png"}, {"index": 14, "direction": 0, "frame": 14, "empty": false, "x": 43, "y": 85, "width": 95, "height": 117, "file": "d00_f014.png"}], "metadata": "metadata.json", "id": "game/res/magic/0329.tcp"}]}</script>
<script>
const manifest=JSON.parse(document.getElementById('manifest').textContent);
for(const resource of manifest.entries){
 if(!resource.frames) continue;
 const card=document.createElement('article'), title=document.createElement('div');
 title.textContent=resource.id+' / '+resource.directions+' directions';
 const select=document.createElement('select');
 for(let d=0;d<resource.directions;d++)select.add(new Option('Direction '+d,d));
 const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');
 const frames=resource.frames.filter(f=>!f.empty);
 if(!frames.length)continue;
 const left=Math.min(...frames.map(f=>-f.x)),top=Math.min(...frames.map(f=>-f.y));
 canvas.width=Math.max(...frames.map(f=>f.width-f.x))-left;
 canvas.height=Math.max(...frames.map(f=>f.height-f.y))-top;
 const images=resource.frames.map(f=>{
  if(f.empty)return null;
  const image=new Image();image.src=f.file;return image;
 });
 let tick=0;
 const link=document.createElement('a');link.href=resource.metadata;link.textContent='metadata';
 card.append(title,select,link,canvas);document.getElementById('gallery').append(card);
 function draw(){
  const i=Number(select.value)*resource.frames_per_direction+tick%resource.frames_per_direction;
  const f=resource.frames[i],image=images[i];
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(image&&image.complete&&image.naturalWidth)ctx.drawImage(image,-f.x-left,-f.y-top);
  tick++;
 }
 setInterval(draw,100);draw();
}
</script>
