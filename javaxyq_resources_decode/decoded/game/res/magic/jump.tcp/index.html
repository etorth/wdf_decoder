<!doctype html>
<meta charset="utf-8">
<title>WDF sprite preview</title>
<style>
body{font:16px system-ui;background:#202124;color:#eee;margin:24px}
#gallery{display:flex;flex-wrap:wrap;gap:16px}
article{background:#303134;padding:12px;width:240px}
canvas{width:240px;height:240px;object-fit:contain;
background:repeating-conic-gradient(#555 0% 25%,#444 0% 50%) 0/16px 16px}
select{margin:8px} a{color:#9cf}
</style>
<h1>WDF sprite preview</h1>
<p>One card per resource. Select a direction; animations run at 10 fps
(preview speed, not timing stored in the source). PNGs retain transparency.</p>
<div id="gallery"></div>
<script id="manifest" type="application/json">{"entries": [{"directions": 1, "frames_per_direction": 15, "width": 142, "height": 82, "x": 71, "y": 25, "frames": [{"index": 0, "direction": 0, "frame": 0, "empty": false, "x": 68, "y": 9, "width": 117, "height": 59, "file": "d00_f000.png"}, {"index": 1, "direction": 0, "frame": 1, "empty": false, "x": 67, "y": 15, "width": 117, "height": 59, "file": "d00_f001.png"}, {"index": 2, "direction": 0, "frame": 2, "empty": false, "x": 53, "y": 15, "width": 103, "height": 61, "file": "d00_f002.png"}, {"index": 3, "direction": 0, "frame": 3, "empty": false, "x": 53, "y": 25, "width": 104, "height": 73, "file": "d00_f003.png"}, {"index": 4, "direction": 0, "frame": 4, "empty": false, "x": 53, "y": 18, "width": 104, "height": 65, "file": "d00_f004.png"}, {"index": 5, "direction": 0, "frame": 5, "empty": false, "x": 53, "y": 15, "width": 118, "height": 61, "file": "d00_f005.png"}, {"index": 6, "direction": 0, "frame": 6, "empty": false, "x": 53, "y": 11, "width": 124, "height": 59, "file": "d00_f006.png"}, {"index": 7, "direction": 0, "frame": 7, "empty": false, "x": 53, "y": 11, "width": 109, "height": 67, "file": "d00_f007.png"}, {"index": 8, "direction": 0, "frame": 8, "empty": false, "x": 53, "y": 11, "width": 104, "height": 63, "file": "d00_f008.png"}, {"index": 9, "direction": 0, "frame": 9, "empty": false, "x": 56, "y": 10, "width": 107, "height": 67, "file": "d00_f009.png"}, {"index": 10, "direction": 0, "frame": 10, "empty": false, "x": 70, "y": 9, "width": 121, "height": 59, "file": "d00_f010.png"}, {"index": 11, "direction": 0, "frame": 11, "empty": false, "x": 71, "y": 12, "width": 121, "height": 57, "file": "d00_f011.png"}, {"index": 12, "direction": 0, "frame": 12, "empty": false, "x": 55, "y": 19, "width": 106, "height": 65, "file": "d00_f012.png"}, {"index": 13, "direction": 0, "frame": 13, "empty": false, "x": 53, "y": 21, "width": 104, "height": 69, "file": "d00_f013.png"}, {"index": 14, "direction": 0, "frame": 14, "empty": false, "x": 53, "y": 20, "width": 103, "height": 69, "file": "d00_f014.png"}], "metadata": "metadata.json", "id": "game/res/magic/jump.tcp"}]}</script>
<script>
const manifest=JSON.parse(document.getElementById('manifest').textContent);
for(const resource of manifest.entries){
 if(!resource.frames) continue;
 const card=document.createElement('article'), title=document.createElement('div');
 title.textContent=resource.id+' / '+resource.directions+' directions';
 const select=document.createElement('select');
 for(let d=0;d<resource.directions;d++)select.add(new Option('Direction '+d,d));
 const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');
 const frames=resource.frames.filter(f=>!f.empty);
 if(!frames.length)continue;
 const left=Math.min(...frames.map(f=>-f.x)),top=Math.min(...frames.map(f=>-f.y));
 canvas.width=Math.max(...frames.map(f=>f.width-f.x))-left;
 canvas.height=Math.max(...frames.map(f=>f.height-f.y))-top;
 const images=resource.frames.map(f=>{
  if(f.empty)return null;
  const image=new Image();image.src=f.file;return image;
 });
 let tick=0;
 const link=document.createElement('a');link.href=resource.metadata;link.textContent='metadata';
 card.append(title,select,link,canvas);document.getElementById('gallery').append(card);
 function draw(){
  const i=Number(select.value)*resource.frames_per_direction+tick%resource.frames_per_direction;
  const f=resource.frames[i],image=images[i];
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(image&&image.complete&&image.naturalWidth)ctx.drawImage(image,-f.x-left,-f.y-top);
  tick++;
 }
 setInterval(draw,100);draw();
}
</script>
