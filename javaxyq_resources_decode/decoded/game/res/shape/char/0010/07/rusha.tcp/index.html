<!doctype html>
<meta charset="utf-8">
<title>WDF sprite preview</title>
<style>
body{font:16px system-ui;background:#202124;color:#eee;margin:24px}
#gallery{display:flex;flex-wrap:wrap;gap:16px}
article{background:#303134;padding:12px;width:240px}
canvas{width:240px;height:240px;object-fit:contain;
background:repeating-conic-gradient(#555 0% 25%,#444 0% 50%) 0/16px 16px}
select{margin:8px} a{color:#9cf}
</style>
<h1>WDF sprite preview</h1>
<p>One card per resource. Select a direction; animations run at 10 fps
(preview speed, not timing stored in the source). PNGs retain transparency.</p>
<div id="gallery"></div>
<script id="manifest" type="application/json">{"entries": [{"directions": 4, "frames_per_direction": 4, "width": 205, "height": 143, "x": 102, "y": 89, "frames": [{"index": 0, "direction": 0, "frame": 0, "empty": false, "x": 80, "y": 60, "width": 120, "height": 35, "file": "d00_f000.png"}, {"index": 1, "direction": 0, "frame": 1, "empty": false, "x": 82, "y": 46, "width": 119, "height": 22, "file": "d00_f001.png"}, {"index": 2, "direction": 0, "frame": 2, "empty": false, "x": 77, "y": 58, "width": 112, "height": 34, "file": "d00_f002.png"}, {"index": 3, "direction": 0, "frame": 3, "empty": false, "x": 79, "y": 43, "width": 116, "height": 24, "file": "d00_f003.png"}, {"index": 4, "direction": 1, "frame": 0, "empty": false, "x": 29, "y": 55, "width": 88, "height": 25, "file": "d01_f000.png"}, {"index": 5, "direction": 1, "frame": 1, "empty": false, "x": 26, "y": 48, "width": 98, "height": 24, "file": "d01_f001.png"}, {"index": 6, "direction": 1, "frame": 2, "empty": false, "x": 30, "y": 59, "width": 94, "height": 30, "file": "d01_f002.png"}, {"index": 7, "direction": 1, "frame": 3, "empty": false, "x": 32, "y": 44, "width": 99, "height": 23, "file": "d01_f003.png"}, {"index": 8, "direction": 2, "frame": 0, "empty": false, "x": 44, "y": 81, "width": 126, "height": 109, "file": "d02_f000.png"}, {"index": 9, "direction": 2, "frame": 1, "empty": false, "x": 38, "y": 66, "width": 122, "height": 103, "file": "d02_f001.png"}, {"index": 10, "direction": 2, "frame": 2, "empty": false, "x": 37, "y": 83, "width": 117, "height": 119, "file": "d02_f002.png"}, {"index": 11, "direction": 2, "frame": 3, "empty": false, "x": 37, "y": 66, "width": 120, "height": 108, "file": "d02_f003.png"}, {"index": 12, "direction": 3, "frame": 0, "empty": false, "x": 61, "y": 86, "width": 88, "height": 127, "file": "d03_f000.png"}, {"index": 13, "direction": 3, "frame": 1, "empty": false, "x": 74, "y": 65, "width": 100, "height": 111, "file": "d03_f001.png"}, {"index": 14, "direction": 3, "frame": 2, "empty": false, "x": 66, "y": 85, "width": 95, "height": 128, "file": "d03_f002.png"}, {"index": 15, "direction": 3, "frame": 3, "empty": false, "x": 69, "y": 65, "width": 96, "height": 113, "file": "d03_f003.png"}], "metadata": "metadata.json", "id": "game/res/shape/char/0010/07/rusha.tcp"}]}</script>
<script>
const manifest=JSON.parse(document.getElementById('manifest').textContent);
for(const resource of manifest.entries){
 if(!resource.frames) continue;
 const card=document.createElement('article'), title=document.createElement('div');
 title.textContent=resource.id+' / '+resource.directions+' directions';
 const select=document.createElement('select');
 for(let d=0;d<resource.directions;d++)select.add(new Option('Direction '+d,d));
 const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');
 const frames=resource.frames.filter(f=>!f.empty);
 if(!frames.length)continue;
 const left=Math.min(...frames.map(f=>-f.x)),top=Math.min(...frames.map(f=>-f.y));
 canvas.width=Math.max(...frames.map(f=>f.width-f.x))-left;
 canvas.height=Math.max(...frames.map(f=>f.height-f.y))-top;
 const images=resource.frames.map(f=>{
  if(f.empty)return null;
  const image=new Image();image.src=f.file;return image;
 });
 let tick=0;
 const link=document.createElement('a');link.href=resource.metadata;link.textContent='metadata';
 card.append(title,select,link,canvas);document.getElementById('gallery').append(card);
 function draw(){
  const i=Number(select.value)*resource.frames_per_direction+tick%resource.frames_per_direction;
  const f=resource.frames[i],image=images[i];
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(image&&image.complete&&image.naturalWidth)ctx.drawImage(image,-f.x-left,-f.y-top);
  tick++;
 }
 setInterval(draw,100);draw();
}
</script>
