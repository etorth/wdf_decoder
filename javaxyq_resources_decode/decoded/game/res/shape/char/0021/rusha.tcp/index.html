<!doctype html>
<meta charset="utf-8">
<title>WDF sprite preview</title>
<style>
body{font:16px system-ui;background:#202124;color:#eee;margin:24px}
#gallery{display:flex;flex-wrap:wrap;gap:16px}
article{background:#303134;padding:12px;width:240px}
canvas{width:240px;height:240px;object-fit:contain;
background:repeating-conic-gradient(#555 0% 25%,#444 0% 50%) 0/16px 16px}
select{margin:8px} a{color:#9cf}
</style>
<h1>WDF sprite preview</h1>
<p>One card per resource. Select a direction; animations run at 10 fps
(preview speed, not timing stored in the source). PNGs retain transparency.</p>
<div id="gallery"></div>
<script id="manifest" type="application/json">{"entries": [{"directions": 4, "frames_per_direction": 5, "width": 141, "height": 122, "x": 70, "y": 104, "frames": [{"index": 0, "direction": 0, "frame": 0, "empty": false, "x": 70, "y": 101, "width": 102, "height": 105, "file": "d00_f000.png"}, {"index": 1, "direction": 0, "frame": 1, "empty": false, "x": 66, "y": 104, "width": 106, "height": 115, "file": "d00_f001.png"}, {"index": 2, "direction": 0, "frame": 2, "empty": false, "x": 70, "y": 99, "width": 104, "height": 100, "file": "d00_f002.png"}, {"index": 3, "direction": 0, "frame": 3, "empty": false, "x": 67, "y": 102, "width": 94, "height": 108, "file": "d00_f003.png"}, {"index": 4, "direction": 0, "frame": 4, "empty": false, "x": 70, "y": 101, "width": 102, "height": 105, "file": "d00_f004.png"}, {"index": 5, "direction": 1, "frame": 0, "empty": false, "x": 22, "y": 101, "width": 79, "height": 100, "file": "d01_f000.png"}, {"index": 6, "direction": 1, "frame": 1, "empty": false, "x": 25, "y": 103, "width": 84, "height": 112, "file": "d01_f001.png"}, {"index": 7, "direction": 1, "frame": 2, "empty": false, "x": 18, "y": 98, "width": 76, "height": 100, "file": "d01_f002.png"}, {"index": 8, "direction": 1, "frame": 3, "empty": false, "x": 16, "y": 101, "width": 76, "height": 111, "file": "d01_f003.png"}, {"index": 9, "direction": 1, "frame": 4, "empty": false, "x": 22, "y": 101, "width": 79, "height": 100, "file": "d01_f004.png"}, {"index": 10, "direction": 2, "frame": 0, "empty": false, "x": 32, "y": 87, "width": 102, "height": 96, "file": "d02_f000.png"}, {"index": 11, "direction": 2, "frame": 1, "empty": false, "x": 40, "y": 95, "width": 106, "height": 100, "file": "d02_f001.png"}, {"index": 12, "direction": 2, "frame": 2, "empty": false, "x": 34, "y": 87, "width": 105, "height": 94, "file": "d02_f002.png"}, {"index": 13, "direction": 2, "frame": 3, "empty": false, "x": 27, "y": 88, "width": 93, "height": 92, "file": "d02_f003.png"}, {"index": 14, "direction": 2, "frame": 4, "empty": false, "x": 32, "y": 87, "width": 102, "height": 96, "file": "d02_f004.png"}, {"index": 15, "direction": 3, "frame": 0, "empty": false, "x": 58, "y": 90, "width": 80, "height": 98, "file": "d03_f000.png"}, {"index": 16, "direction": 3, "frame": 1, "empty": false, "x": 60, "y": 97, "width": 85, "height": 115, "file": "d03_f001.png"}, {"index": 17, "direction": 3, "frame": 2, "empty": false, "x": 58, "y": 89, "width": 76, "height": 96, "file": "d03_f002.png"}, {"index": 18, "direction": 3, "frame": 3, "empty": false, "x": 60, "y": 91, "width": 76, "height": 101, "file": "d03_f003.png"}, {"index": 19, "direction": 3, "frame": 4, "empty": false, "x": 58, "y": 90, "width": 80, "height": 98, "file": "d03_f004.png"}], "metadata": "metadata.json", "id": "game/res/shape/char/0021/rusha.tcp"}]}</script>
<script>
const manifest=JSON.parse(document.getElementById('manifest').textContent);
for(const resource of manifest.entries){
 if(!resource.frames) continue;
 const card=document.createElement('article'), title=document.createElement('div');
 title.textContent=resource.id+' / '+resource.directions+' directions';
 const select=document.createElement('select');
 for(let d=0;d<resource.directions;d++)select.add(new Option('Direction '+d,d));
 const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');
 const frames=resource.frames.filter(f=>!f.empty);
 if(!frames.length)continue;
 const left=Math.min(...frames.map(f=>-f.x)),top=Math.min(...frames.map(f=>-f.y));
 canvas.width=Math.max(...frames.map(f=>f.width-f.x))-left;
 canvas.height=Math.max(...frames.map(f=>f.height-f.y))-top;
 const images=resource.frames.map(f=>{
  if(f.empty)return null;
  const image=new Image();image.src=f.file;return image;
 });
 let tick=0;
 const link=document.createElement('a');link.href=resource.metadata;link.textContent='metadata';
 card.append(title,select,link,canvas);document.getElementById('gallery').append(card);
 function draw(){
  const i=Number(select.value)*resource.frames_per_direction+tick%resource.frames_per_direction;
  const f=resource.frames[i],image=images[i];
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(image&&image.complete&&image.naturalWidth)ctx.drawImage(image,-f.x-left,-f.y-top);
  tick++;
 }
 setInterval(draw,100);draw();
}
</script>
