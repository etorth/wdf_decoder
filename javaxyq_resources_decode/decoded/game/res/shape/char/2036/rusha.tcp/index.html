<!doctype html>
<meta charset="utf-8">
<title>WDF sprite preview</title>
<style>
body{font:16px system-ui;background:#202124;color:#eee;margin:24px}
#gallery{display:flex;flex-wrap:wrap;gap:16px}
article{background:#303134;padding:12px;width:240px}
canvas{width:240px;height:240px;object-fit:contain;
background:repeating-conic-gradient(#555 0% 25%,#444 0% 50%) 0/16px 16px}
select{margin:8px} a{color:#9cf}
</style>
<h1>WDF sprite preview</h1>
<p>One card per resource. Select a direction; animations run at 10 fps
(preview speed, not timing stored in the source). PNGs retain transparency.</p>
<div id="gallery"></div>
<script id="manifest" type="application/json">{"entries": [{"directions": 4, "frames_per_direction": 5, "width": 66, "height": 54, "x": 33, "y": 33, "frames": [{"index": 0, "direction": 0, "frame": 0, "empty": false, "x": 17, "y": 19, "width": 49, "height": 37, "file": "d00_f000.png"}, {"index": 1, "direction": 0, "frame": 1, "empty": false, "x": 18, "y": 21, "width": 47, "height": 35, "file": "d00_f001.png"}, {"index": 2, "direction": 0, "frame": 2, "empty": false, "x": 21, "y": 22, "width": 51, "height": 41, "file": "d00_f002.png"}, {"index": 3, "direction": 0, "frame": 3, "empty": false, "x": 23, "y": 21, "width": 51, "height": 40, "file": "d00_f003.png"}, {"index": 4, "direction": 0, "frame": 4, "empty": false, "x": 17, "y": 19, "width": 49, "height": 37, "file": "d00_f004.png"}, {"index": 5, "direction": 1, "frame": 0, "empty": false, "x": 26, "y": 19, "width": 51, "height": 37, "file": "d01_f000.png"}, {"index": 6, "direction": 1, "frame": 1, "empty": false, "x": 30, "y": 21, "width": 59, "height": 41, "file": "d01_f001.png"}, {"index": 7, "direction": 1, "frame": 2, "empty": false, "x": 28, "y": 22, "width": 45, "height": 35, "file": "d01_f002.png"}, {"index": 8, "direction": 1, "frame": 3, "empty": false, "x": 26, "y": 21, "width": 43, "height": 34, "file": "d01_f003.png"}, {"index": 9, "direction": 1, "frame": 4, "empty": false, "x": 26, "y": 19, "width": 51, "height": 37, "file": "d01_f004.png"}, {"index": 10, "direction": 2, "frame": 0, "empty": false, "x": 33, "y": 31, "width": 50, "height": 52, "file": "d02_f000.png"}, {"index": 11, "direction": 2, "frame": 1, "empty": false, "x": 29, "y": 32, "width": 48, "height": 47, "file": "d02_f001.png"}, {"index": 12, "direction": 2, "frame": 2, "empty": false, "x": 30, "y": 33, "width": 51, "height": 44, "file": "d02_f002.png"}, {"index": 13, "direction": 2, "frame": 3, "empty": false, "x": 28, "y": 32, "width": 51, "height": 46, "file": "d02_f003.png"}, {"index": 14, "direction": 2, "frame": 4, "empty": false, "x": 33, "y": 31, "width": 50, "height": 52, "file": "d02_f004.png"}, {"index": 15, "direction": 3, "frame": 0, "empty": false, "x": 25, "y": 31, "width": 51, "height": 46, "file": "d03_f000.png"}, {"index": 16, "direction": 3, "frame": 1, "empty": false, "x": 29, "y": 32, "width": 59, "height": 49, "file": "d03_f001.png"}, {"index": 17, "direction": 3, "frame": 2, "empty": false, "x": 17, "y": 33, "width": 45, "height": 49, "file": "d03_f002.png"}, {"index": 18, "direction": 3, "frame": 3, "empty": false, "x": 17, "y": 33, "width": 43, "height": 48, "file": "d03_f003.png"}, {"index": 19, "direction": 3, "frame": 4, "empty": false, "x": 25, "y": 31, "width": 51, "height": 46, "file": "d03_f004.png"}], "metadata": "metadata.json", "id": "game/res/shape/char/2036/rusha.tcp"}]}</script>
<script>
const manifest=JSON.parse(document.getElementById('manifest').textContent);
for(const resource of manifest.entries){
 if(!resource.frames) continue;
 const card=document.createElement('article'), title=document.createElement('div');
 title.textContent=resource.id+' / '+resource.directions+' directions';
 const select=document.createElement('select');
 for(let d=0;d<resource.directions;d++)select.add(new Option('Direction '+d,d));
 const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');
 const frames=resource.frames.filter(f=>!f.empty);
 if(!frames.length)continue;
 const left=Math.min(...frames.map(f=>-f.x)),top=Math.min(...frames.map(f=>-f.y));
 canvas.width=Math.max(...frames.map(f=>f.width-f.x))-left;
 canvas.height=Math.max(...frames.map(f=>f.height-f.y))-top;
 const images=resource.frames.map(f=>{
  if(f.empty)return null;
  const image=new Image();image.src=f.file;return image;
 });
 let tick=0;
 const link=document.createElement('a');link.href=resource.metadata;link.textContent='metadata';
 card.append(title,select,link,canvas);document.getElementById('gallery').append(card);
 function draw(){
  const i=Number(select.value)*resource.frames_per_direction+tick%resource.frames_per_direction;
  const f=resource.frames[i],image=images[i];
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(image&&image.complete&&image.naturalWidth)ctx.drawImage(image,-f.x-left,-f.y-top);
  tick++;
 }
 setInterval(draw,100);draw();
}
</script>
